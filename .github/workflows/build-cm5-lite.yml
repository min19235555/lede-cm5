name: Build LEDE for Radxa CM5 Lite

on:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: lede-cm5-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 350

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/lib/jvm
          sudo apt-get clean
          df -h /

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gettext git libncurses-dev libssl-dev python3 python3-dev \
            python3-setuptools python3-pyelftools swig rsync unzip \
            zlib1g-dev file wget ccache libelf-dev \
            liblzma-dev liblz4-dev uuid-dev libzstd-dev

      - name: Work around incomplete host bison data
        run: |
          # LEDE's staged bison ships without share/bison (m4sugar etc.), which
          # breaks host elfutils. The runner's bison is the same 3.8.2.
          ls /usr/share/bison/m4sugar/m4sugar.m4
          echo "BISON_PKGDATADIR=/usr/share/bison" >> $GITHUB_ENV

      - name: Configure firmware
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          cat > .config <<'EOF'
          CONFIG_TARGET_rockchip=y
          CONFIG_TARGET_rockchip_armv8=y
          CONFIG_TARGET_rockchip_armv8_DEVICE_radxa_cm5_lite_asm1184e=y
          CONFIG_TARGET_KERNEL_PARTSIZE=64
          CONFIG_TARGET_ROOTFS_PARTSIZE=512
          CONFIG_PACKAGE_luci=y
          EOF
          make defconfig
          echo '--- selected device ---'
          grep -E 'CONFIG_TARGET_rockchip_armv8_DEVICE|CONFIG_PACKAGE_luci=' .config

      - name: Download sources
        run: |
          make -j"$(nproc)" download

      - name: Probe host tools (verbose, fail fast)
        run: |
          set -o pipefail
          # LEDE's staged bison is installed without share/bison, and the build
          # system overrides BISON_PKGDATADIR with that path. Seed the data from
          # the runner's bison (same 3.8.2) before anything needs it.
          make -j1 tools/bison/compile
          mkdir -p staging_dir/host/share/bison
          cp -a /usr/share/bison/. staging_dir/host/share/bison/
          ls staging_dir/host/share/bison/m4sugar/m4sugar.m4
          make -j1 V=s tools/elfutils/compile 2>&1 | tail -300
          echo "=== erofs-utils ==="
          make -j1 V=s tools/erofs-utils/compile 2>&1 | tail -200

      - name: Build host tools
        run: |
          set -o pipefail
          make -j"$(nproc)" tools/compile 2>&1 | tee tools.log

      - name: Build toolchain
        run: |
          set -o pipefail
          make -j"$(nproc)" toolchain/compile 2>&1 | tee toolchain.log

      - name: Compile target/linux (verbose)
        run: |
          set -o pipefail
          make -j"$(nproc)" V=s target/linux/compile 2>&1 | tee target-linux.log

      - name: Compile kernel modules (verbose)
        run: |
          set -o pipefail
          make -j"$(nproc)" V=s package/kernel/linux/compile 2>&1 | tee kmod.log

      - name: Compile all packages
        run: |
          set -o pipefail
          make -j"$(nproc)" package/compile 2>&1 | tee package-compile.log

      - name: Build
        run: |
          set -o pipefail
          make -j"$(nproc)" 2>&1 | tee build.log

      - name: Upload firmware
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lede-rockchip-armv8-radxa_cm5_lite
          path: |
            bin/targets/rockchip/armv8/*.img.gz
            bin/targets/rockchip/armv8/*.sha256
            bin/targets/rockchip/armv8/*.manifest
            bin/targets/rockchip/armv8/*.buildinfo
          if-no-files-found: warn

      - name: Upload build logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: |
            tools.log
            toolchain.log
            target-linux.log
            kmod.log
            package-compile.log
            build.log
          if-no-files-found: warn
