name: Build LEDE for Radxa CM5 Lite

on:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: lede-cm5-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 350

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/lib/jvm
          sudo apt-get clean
          df -h /

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gettext git libncurses-dev libssl-dev python3 python3-dev \
            python3-setuptools python3-pyelftools swig rsync unzip \
            zlib1g-dev file wget ccache libelf-dev \
            liblzma-dev liblz4-dev uuid-dev libzstd-dev

      - name: Work around incomplete host bison data
        run: |
          ls /usr/share/bison/m4sugar/m4sugar.m4
          echo "BISON_PKGDATADIR=/usr/share/bison" >> $GITHUB_ENV

      - name: Configure firmware
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          cat > .config <<'EOF'
          CONFIG_TARGET_rockchip=y
          CONFIG_TARGET_rockchip_armv8=y
          CONFIG_TARGET_rockchip_armv8_DEVICE_radxa_cm5_lite_asm1184e=y
          CONFIG_TARGET_KERNEL_PARTSIZE=64
          CONFIG_TARGET_ROOTFS_PARTSIZE=512
          CONFIG_PACKAGE_luci=y
          EOF
          make defconfig
          echo '--- selected device ---'
          grep -E 'CONFIG_TARGET_rockchip_armv8_DEVICE|CONFIG_PACKAGE_luci=' .config

      - name: Download sources
        run: |
          for i in 1 2 3; do
            make -j"$(nproc)" download && exit 0
            echo "download attempt $i failed, retrying in 20s"
            sleep 20
          done
          echo "download failed after 3 attempts" >&2
          exit 1

      - name: Build host tools
        run: |
          set -o pipefail
          make -j"$(nproc)" tools/compile 2>&1 | tee tools.log

      - name: Build toolchain
        run: |
          set -o pipefail
          make -j"$(nproc)" toolchain/compile 2>&1 | tee toolchain.log

      - name: Compile target/linux (verbose)
        run: |
          set -o pipefail
          make -j"$(nproc)" V=s target/linux/compile 2>&1 | tee target-linux.log

      - name: Compile kernel modules (verbose)
        run: |
          set -o pipefail
          make -j"$(nproc)" V=s package/kernel/linux/compile 2>&1 | tee kmod.log

      - name: Compile rkbin blobs + ARM TF-A (prerequisite for U-Boot)
        run: |
          set -o pipefail
          # Multi-variant packages: build rk3588 variant explicitly
          make -j"$(nproc)" V=s package/boot/rockchip-rkbin-rk3588/compile 2>&1 | tail -30
          make -j"$(nproc)" V=s package/boot/arm-trusted-firmware-rockchip-rk3588/compile 2>&1 | tail -30
          echo '=== staging_dir/image contents ==='
          ls -la staging_dir/target-aarch64_generic_musl/image/
          echo '=== expected rk3588 files ==='
          for f in rk3588_ddr_lp4_2112MHz_lp5_2400MHz_v1.18.bin rk3588_bl31.elf; do
            if [ -f "staging_dir/target-aarch64_generic_musl/image/$f" ]; then
              echo "  OK: $f ($(du -h staging_dir/target-aarch64_generic_musl/image/$f | cut -f1))"
            else
              echo "  MISSING: $f"
            fi
          done

      - name: Compile U-Boot (verbose)
        run: |
          set -o pipefail
          # Builds generic-rk3588-idbloader.img + generic-rk3588-u-boot.itb
          # which pine64-img needs in staging_dir/image/
          make -j"$(nproc)" V=s package/boot/uboot-rockchip/compile 2>&1 | tee uboot.log
          echo '=== U-Boot artifacts ==='
          ls -la staging_dir/target-aarch64_generic_musl/image/ | grep -E "generic-rk3588|idbloader|u-boot"

      - name: Build packages
        run: |
          set -o pipefail
          make -j"$(nproc)" package/compile 2>&1 | tee packages.log

      - name: Install target (verbose)
        run: |
          set -o pipefail
          make -j"$(nproc)" V=s target/linux/install 2>&1 | tee target-install.log

      - name: Upload firmware
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lede-rockchip-armv8-radxa_cm5_lite
          path: |
            bin/targets/rockchip/armv8/*.img.gz
            bin/targets/rockchip/armv8/*.sha256
            bin/targets/rockchip/armv8/*.manifest
            bin/targets/rockchip/armv8/*.buildinfo
          if-no-files-found: warn

      - name: Upload build logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: |
            tools.log
            toolchain.log
            target-linux.log
            kmod.log
            uboot.log
            packages.log
            target-install.log
          if-no-files-found: warn
